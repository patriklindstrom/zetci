[package]
name = "zetci"
version = "0.1.2"
edition = "2021"
authors = ["Patrik Lindstrom <patrik.lindstrom.dev>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.21", features = ["cargo"] }
clap_generate = "3.0.3"
csv = "1.3.1"
env_logger = "0.11.5"
log = "0.4.22"
predicates = "3.1.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
rand = "0.8"
tempfile = "3"
itertools = "0.13"
once_cell = "1.19"
# Optional, only if you want property-based fuzzing later:
proptest = "1.5"

# Optional benchmarking (recommended)
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "zetci_bench"
harness = false
